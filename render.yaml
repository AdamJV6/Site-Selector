services:
  - type: web
    name: site-selector-mvp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: CENSUS_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
